<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Hologram 100x100</title>
<style>
  :root{--bg:#02060d;--cy:#38f0ff;--cy2:#0a8fb0;--tx:#bfeeff;--dim:#6aa7b8;--am:#ffb347}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#06182a 0%,var(--bg) 70%);color:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(56,240,255,.035) 0,rgba(56,240,255,.035) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen}
  .panel{position:fixed;left:16px;top:16px;width:290px;max-height:calc(100% - 100px);overflow:auto;padding:14px 16px;border:1px solid rgba(56,240,255,.35);background:rgba(3,16,28,.55);backdrop-filter:blur(6px);border-radius:6px;box-shadow:0 0 24px rgba(56,240,255,.12) inset,0 0 18px rgba(56,240,255,.08)}
  h1{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 2px;color:var(--cy);font-weight:600}
  .sub{font-size:11px;color:var(--dim);margin-bottom:10px}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dashed rgba(56,240,255,.15)}
  .row span:first-child{color:var(--dim)}
  .row b{color:var(--cy);font-weight:600;text-align:right}
  .sec{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--am);margin:12px 0 2px}
  .hover{position:fixed;right:16px;top:16px;min-width:200px;padding:12px 14px;border:1px solid rgba(56,240,255,.35);background:rgba(3,16,28,.55);backdrop-filter:blur(6px);border-radius:6px;font-size:12px}
  .hover .t{font-size:10px;letter-spacing:.22em;color:var(--am);text-transform:uppercase;margin-bottom:4px}
  .bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:calc(100% - 24px);padding:8px 10px;border:1px solid rgba(56,240,255,.3);background:rgba(3,16,28,.6);backdrop-filter:blur(6px);border-radius:8px}
  button{font:inherit;font-size:12px;color:var(--tx);background:transparent;border:1px solid rgba(56,240,255,.4);border-radius:4px;padding:7px 11px;cursor:pointer;min-height:34px}
  button:hover{background:rgba(56,240,255,.12)}
  button[aria-pressed=true]{background:rgba(56,240,255,.22);color:#fff;box-shadow:0 0 10px rgba(56,240,255,.35)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
  label.sl{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
  input[type=range]{accent-color:var(--cy);width:110px}
  .foot{position:fixed;right:16px;bottom:74px;font-size:10px;color:var(--dim);text-align:right;max-width:240px}
  @media (max-width:760px){
    .panel{width:calc(100% - 24px);left:12px;top:12px;max-height:34%;font-size:11px}
    .hover{display:none}
    .foot{display:none}
  }
  @media (prefers-reduced-motion:reduce){.scan{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D hologram of a 100 by 100 metre field"></canvas>
<div class="scan"></div>

<div class="panel" id="panel">
  <h1>Parcel BL-100</h1>
  <div class="sub">Imaginary field &middot; 100 m &times; 100 m &middot; offer review</div>
  <div class="sec">Geometry</div>
  <div id="m-geo"></div>
  <div class="sec">Terrain</div>
  <div id="m-ter"></div>
  <div class="sec">Earthworks (level at mean)</div>
  <div id="m-earth"></div>
  <div class="sec">Features</div>
  <div id="m-feat"></div>
</div>

<div class="hover" id="hover">
  <div class="t">Probe</div>
  <div id="probe">Move the cursor over the field</div>
</div>

<div class="bar">
  <button id="b-rot" aria-pressed="true">Auto-rotate</button>
  <button id="b-con" aria-pressed="true">Contours</button>
  <button id="b-wire" aria-pressed="false">Wireframe</button>
  <button id="b-feat" aria-pressed="true">Features</button>
  <button id="b-top">Top view</button>
  <button id="b-reset">Reset view</button>
  <label class="sl">Vertical &times;<input id="exag" type="range" min="1" max="8" step="0.5" value="3" aria-label="Vertical exaggeration"><span id="exv">3.0</span></label>
</div>
<div class="foot">Illustrative model. Elevation is synthetic, not survey data. Vertical scale exaggerated.</div>

<script>/*THREE*/</script>
<script>
(function(){
'use strict';
// ---------- synthetic terrain (meters, local coords x,z in [-50,50]) ----------
var N = 100, SIZE = 100, HALF = 50;
function gauss(dx,dz,s){return Math.exp(-(dx*dx+dz*dz)/(2*s*s));}
function H(x,z){
  var h = 112 + 0.025*x - 0.018*z;
  h += 1.3*Math.sin(x*0.055+1.0)*Math.cos(z*0.045-0.5);
  h += 0.55*Math.sin(x*0.14+z*0.11+2.0);
  h += 0.25*Math.sin(x*0.31)*Math.cos(z*0.27);
  h += 2.2*gauss(x-28,z+25,14);
  h -= 2.4*gauss(x+22,z-20,9);
  return h;
}
var POND = {x:-22, z:20, r:9};
// road centreline
function roadPt(t){ // t 0..1, west edge to east edge
  var x = -HALF + t*SIZE;
  var z = -30 + 42*(t*t*(3-2*t)) + 4*Math.sin(t*6.0);
  return {x:x,z:z};
}
// seeded rng
function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ---------- metrics ----------
var M = (function(){
  var min=1e9,max=-1e9,sum=0,cnt=0,i,j,x,z;
  var g=[];
  for(i=0;i<=N;i++){g[i]=[];for(j=0;j<=N;j++){var h=H(-HALF+i,-HALF+j);g[i][j]=h;if(h<min)min=h;if(h>max)max=h;sum+=h;cnt++;}}
  var mean=sum/cnt;
  var surf=0, cut=0, fill=0, slopeSum=0, slopeMax=0, sc=0;
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var a=g[i][j],b=g[i+1][j],c=g[i][j+1],d=g[i+1][j+1];
    surf += tri(0,a,0, 1,b,0, 0,c,1) + tri(1,b,0, 1,d,1, 0,c,1);
    var avg=(a+b+c+d)/4-mean;
    if(avg>0)cut+=avg; else fill-=avg;
    var gx=((b+d)-(a+c))/2, gz=((c+d)-(a+b))/2;
    var sl=Math.sqrt(gx*gx+gz*gz)*100;
    slopeSum+=sl; sc++; if(sl>slopeMax)slopeMax=sl;
  }
  function tri(x1,y1,z1,x2,y2,z2,x3,y3,z3){
    var ux=x2-x1,uy=y2-y1,uz=z2-z1,vx=x3-x1,vy=y3-y1,vz=z3-z1;
    var cx=uy*vz-uz*vy,cy=uz*vx-ux*vz,cz=ux*vy-uy*vx;
    return 0.5*Math.sqrt(cx*cx+cy*cy+cz*cz);
  }
  // pond level: mean terrain on ring r
  var ring=0,rn=48;
  for(i=0;i<rn;i++){var an=i/rn*Math.PI*2;ring+=H(POND.x+POND.r*Math.cos(an),POND.z+POND.r*Math.sin(an));}
  var wl=ring/rn;
  // road length
  var rl=0,prev=roadPt(0),ph=H(prev.x,prev.z);
  for(i=1;i<=200;i++){var p=roadPt(i/200),hh=H(p.x,p.z);rl+=Math.sqrt((p.x-prev.x)*(p.x-prev.x)+(p.z-prev.z)*(p.z-prev.z)+(hh-ph)*(hh-ph));prev=p;ph=hh;}
  return {min:min,max:max,mean:mean,surf:surf,cut:cut,fill:fill,slopeAvg:slopeSum/sc,slopeMax:slopeMax,wl:wl,roadLen:rl};
})();

// ---------- UI metrics ----------
function fmt(v,d){return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function rows(id,list){document.getElementById(id).innerHTML=list.map(function(r){return '<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('');}
var TREES = 0;
function renderMetrics(){
  rows('m-geo',[
    ['Plan area',fmt(SIZE*SIZE,0)+' m² (1.00 ha)'],
    ['Perimeter',fmt(SIZE*4,0)+' m'],
    ['Surface area (3D)',fmt(M.surf,0)+' m²'],
  ]);
  rows('m-ter',[
    ['Elevation min / max',fmt(M.min,2)+' / '+fmt(M.max,2)+' m'],
    ['Mean elevation',fmt(M.mean,2)+' m'],
    ['Relief',fmt(M.max-M.min,2)+' m'],
    ['Slope avg / max',fmt(M.slopeAvg,1)+' / '+fmt(M.slopeMax,1)+' %'],
  ]);
  rows('m-earth',[
    ['Cut volume',fmt(M.cut,0)+' m³'],
    ['Fill volume',fmt(M.fill,0)+' m³'],
    ['Net',fmt(M.cut-M.fill,0)+' m³'],
  ]);
  rows('m-feat',[
    ['Pond (approx.)',fmt(Math.PI*POND.r*POND.r,0)+' m²'],
    ['Access road',fmt(M.roadLen,0)+' m'],
    ['Tree clusters',TREES+' trees'],
  ]);
}

// ---------- three.js ----------
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,0.5,2000);
var content=new THREE.Group(); scene.add(content);
var animated=[];
var exag=3;
var uniforms={uMin:{value:M.min},uMax:{value:M.max},uTime:{value:0},uContour:{value:1},uInt:{value:0.5}};

var vs='attribute float elev;varying float vH;varying vec3 vP;void main(){vH=elev;vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
var fs=[
 'varying float vH;varying vec3 vP;uniform float uMin,uMax,uTime,uContour,uInt;',
 'void main(){',
 ' float t=clamp((vH-uMin)/(uMax-uMin),0.,1.);',
 ' vec3 lo=vec3(0.02,0.30,1.0),mid=vec3(0.05,0.95,1.0),hi=vec3(0.85,1.0,1.0);',
 ' vec3 col=t<0.5?mix(lo,mid,t*2.):mix(mid,hi,(t-0.5)*2.);',
 ' vec2 g=vP.xz/10.; vec2 gd=abs(fract(g+0.5)-0.5)/fwidth(g);',
 ' float grid=1.-min(min(gd.x,gd.y),1.);',
 ' vec2 g2=vP.xz; vec2 gd2=abs(fract(g2+0.5)-0.5)/fwidth(g2);',
 ' float fine=(1.-min(min(gd2.x,gd2.y),1.))*0.18;',
 ' float f=fract(vH/uInt); float fw=fwidth(vH/uInt);',
 ' float con=(1.-smoothstep(0.,max(fw*1.4,0.001),min(f,1.-f)))*uContour;',
 ' float sweep=exp(-abs(vP.x-(mod(uTime*18.,140.)-70.))*0.35);',
 ' float edge=smoothstep(49.0,49.8,max(abs(vP.x),abs(vP.z)));',
 ' float a=0.10+0.07*t+grid*0.55+fine+con*0.65+sweep*0.45+edge*0.8;',
 ' vec3 c=col*(0.8+grid*0.7+con*0.9)+vec3(sweep*0.5)+vec3(0.1,0.3,0.4)*edge;',
 ' gl_FragColor=vec4(c,clamp(a,0.,1.));',
 '}'].join('\n');
var terrainMat=new THREE.ShaderMaterial({uniforms:uniforms,vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,extensions:{derivatives:true}});
var wireMat=new THREE.MeshBasicMaterial({color:0x39f0ff,wireframe:true,transparent:true,opacity:0.22,blending:THREE.AdditiveBlending,depthWrite:false});
var terrain=null, wire=null, wireOn=false, featOn=true;
var featureGroup=null;

function Y(x,z){return (H(x,z)-M.min)*exag;}

function label(text,color,scale){
  var cv=document.createElement('canvas');cv.width=256;cv.height=64;
  var cx=cv.getContext('2d');cx.font='600 30px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='center';cx.textBaseline='middle';
  cx.shadowColor=color;cx.shadowBlur=10;cx.fillStyle=color;cx.fillText(text,128,32);
  var tex=new THREE.CanvasTexture(cv);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,depthTest:false}));
  sp.scale.set(scale*4,scale,1);return sp;
}
function lineMat(c,o){return new THREE.LineBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false});}

function build(){
  animated.length=0;
  while(content.children.length){var o=content.children.pop();o.traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material&&n.material.map)n.material.map.dispose();});}
  // terrain mesh
  var n1=N+1,pos=new Float32Array(n1*n1*3),el=new Float32Array(n1*n1),idx=[];
  for(var i=0;i<n1;i++)for(var j=0;j<n1;j++){
    var k=i*n1+j,x=-HALF+i,z=-HALF+j,h=H(x,z);
    pos[k*3]=x;pos[k*3+1]=(h-M.min)*exag;pos[k*3+2]=z;el[k]=h;
  }
  for(i=0;i<N;i++)for(j=0;j<N;j++){var a=i*n1+j,b=(i+1)*n1+j,c=i*n1+j+1,d=(i+1)*n1+j+1;idx.push(a,c,b,b,c,d);}
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('elev',new THREE.BufferAttribute(el,1));
  geo.setIndex(idx);
  terrain=new THREE.Mesh(geo,terrainMat);content.add(terrain);
  wire=new THREE.Mesh(geo,wireMat);wire.visible=wireOn;content.add(wire);

  // base plate + grid
  var baseY=-1.2;
  var grid=new THREE.GridHelper(SIZE,10,0x39f0ff,0x0a6a85);grid.position.y=baseY;
  grid.material.transparent=true;grid.material.opacity=0.55;content.add(grid);
  // cross-section skirts
  var skirtMat=new THREE.MeshBasicMaterial({color:0x1fd6ff,transparent:true,opacity:0.10,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  var edges=[[function(t){return [-HALF+t,-HALF];}],[function(t){return [-HALF+t,HALF];}],[function(t){return [-HALF,-HALF+t];}],[function(t){return [HALF,-HALF+t];}]];
  edges.forEach(function(e){
    var f=e[0],sp=[],si=[],lp=[];
    for(var t=0;t<=N;t++){var p=f(t),y=Y(p[0],p[1]);sp.push(p[0],baseY,p[1],p[0],y,p[1]);lp.push(p[0],y,p[1]);if(t<N){var b=t*2;si.push(b,b+1,b+2,b+1,b+3,b+2);}}
    var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));g.setIndex(si);
    content.add(new THREE.Mesh(g,skirtMat));
    var lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
    content.add(new THREE.Line(lg,lineMat(0x7ff6ff,0.95)));
  });
  // base frame
  var fr=new THREE.BufferGeometry().setFromPoints([[-HALF,-HALF],[HALF,-HALF],[HALF,HALF],[-HALF,HALF],[-HALF,-HALF]].map(function(p){return new THREE.Vector3(p[0],baseY,p[1]);}));
  content.add(new THREE.Line(fr,lineMat(0x7ff6ff,0.9)));
  // projector rings
  [70,84].forEach(function(r,ri){
    var rg=new THREE.RingGeometry(r,r+0.4,128);rg.rotateX(-Math.PI/2);
    var rm=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x39f0ff,transparent:true,opacity:ri?0.25:0.5,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    rm.position.y=baseY-0.5;content.add(rm);
  });

  // axis ticks + labels
  for(var m=0;m<=100;m+=20){
    var lx=label(m+' m','#8fe9ff',3.2);lx.position.set(-HALF+m,baseY-1,HALF+7);content.add(lx);
    var lz=label(m+' m','#8fe9ff',3.2);lz.position.set(-HALF-8,baseY-1,-HALF+m);content.add(lz);
    var tk=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-HALF+m,baseY,HALF),new THREE.Vector3(-HALF+m,baseY,HALF+2.5),new THREE.Vector3(-HALF,baseY,-HALF+m),new THREE.Vector3(-HALF-2.5,baseY,-HALF+m)]);
    content.add(new THREE.LineSegments(tk,lineMat(0x8fe9ff,0.9)));
  }
  var ax=label('100 m','#ffb347',4.2);ax.position.set(0,baseY-1,HALF+16);content.add(ax);
  var az=label('100 m','#ffb347',4.2);az.position.set(-HALF-18,baseY-1,0);content.add(az);
  var nl=label('N','#ffb347',5);nl.position.set(0,baseY,-HALF-9);content.add(nl);

  // features
  featureGroup=new THREE.Group();featureGroup.visible=featOn;content.add(featureGroup);
  // corner posts
  var cs=[[-HALF,-HALF,'NW'],[HALF,-HALF,'NE'],[HALF,HALF,'SE'],[-HALF,HALF,'SW']];
  cs.forEach(function(c){
    var y=Y(c[0],c[1]);
    var pg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(c[0],baseY,c[1]),new THREE.Vector3(c[0],y+14,c[1])]);
    featureGroup.add(new THREE.Line(pg,lineMat(0xffb347,0.9)));
    var dm=new THREE.Mesh(new THREE.OctahedronGeometry(1.1),new THREE.MeshBasicMaterial({color:0xffb347,wireframe:true}));
    dm.position.set(c[0],y+14,c[1]);featureGroup.add(dm);animated.push(dm);
    var lb=label(c[2],'#ffb347',4);lb.position.set(c[0],y+19,c[1]);featureGroup.add(lb);
  });
  // pond
  var wy=(M.wl-M.min)*exag+0.15;
  var pg2=new THREE.CircleGeometry(POND.r,48);pg2.rotateX(-Math.PI/2);
  var pm=new THREE.Mesh(pg2,new THREE.MeshBasicMaterial({color:0x1a7dff,transparent:true,opacity:0.45,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  pm.position.set(POND.x,wy,POND.z);featureGroup.add(pm);
  var pr=new THREE.RingGeometry(POND.r-0.25,POND.r,64);pr.rotateX(-Math.PI/2);
  var prm=new THREE.Mesh(pr,new THREE.MeshBasicMaterial({color:0x7fd0ff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  prm.position.copy(pm.position);featureGroup.add(prm);
  var pl=label('POND','#7fd0ff',3.6);pl.position.set(POND.x,wy+6,POND.z);featureGroup.add(pl);
  // road ribbon
  var rp=[],ri=[],S=120,hw=1.6;
  for(var s=0;s<=S;s++){
    var t=s/S,p=roadPt(t),q=roadPt(Math.min(1,t+0.002)),q0=roadPt(Math.max(0,t-0.002));
    var dx=q.x-q0.x,dz=q.z-q0.z,l=Math.sqrt(dx*dx+dz*dz);var nx=-dz/l,nz=dx/l;
    var y=Y(p.x,p.z)+0.25;
    rp.push(p.x+nx*hw,y,p.z+nz*hw,p.x-nx*hw,y,p.z-nz*hw);
    if(s<S){var b=s*2;ri.push(b,b+1,b+2,b+1,b+3,b+2);}
  }
  var rg2=new THREE.BufferGeometry();rg2.setAttribute('position',new THREE.Float32BufferAttribute(rp,3));rg2.setIndex(ri);
  featureGroup.add(new THREE.Mesh(rg2,new THREE.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:0.55,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})));
  var rl=label('ACCESS ROAD','#ffb347',3.2);var rpt=roadPt(0.12);rl.position.set(rpt.x,Y(rpt.x,rpt.z)+6,rpt.z);featureGroup.add(rl);
  // trees (clusters, avoid pond + road)
  var rnd=rng(7),trees=[];
  var centers=[[30,30],[-35,-28],[10,-42],[40,-8],[-42,42]];
  centers.forEach(function(c){
    for(var t=0;t<14;t++){
      var x=c[0]+(rnd()-0.5)*18,z=c[1]+(rnd()-0.5)*18;
      if(Math.abs(x)>HALF-2||Math.abs(z)>HALF-2)continue;
      var dpx=x-POND.x,dpz=z-POND.z;if(dpx*dpx+dpz*dpz<(POND.r+2)*(POND.r+2))continue;
      var near=false;for(var s2=0;s2<=40;s2++){var rr=roadPt(s2/40);if((rr.x-x)*(rr.x-x)+(rr.z-z)*(rr.z-z)<16){near=true;break;}}
      if(near)continue;
      trees.push([x,z,3.5+rnd()*3.5]);
    }
  });
  TREES=trees.length;
  var cone=new THREE.ConeGeometry(1.6,1,6,1,true);cone.translate(0,0.5,0);
  var im=new THREE.InstancedMesh(cone,new THREE.MeshBasicMaterial({color:0x4dffb0,wireframe:true,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}),trees.length);
  var dummy=new THREE.Object3D();
  trees.forEach(function(t,i){dummy.position.set(t[0],Y(t[0],t[1]),t[1]);dummy.scale.set(1,t[2],1);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix);});
  featureGroup.add(im);
  renderMetrics();
}

// particles
var pN=450,pPos=new Float32Array(pN*3),pr=rng(3);
for(var i=0;i<pN;i++){pPos[i*3]=(pr()-0.5)*140;pPos[i*3+1]=pr()*60;pPos[i*3+2]=(pr()-0.5)*140;}
var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pPos,3));
var parts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x6fe8ff,size:0.8,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(parts);

// probe marker
var marker=new THREE.Mesh((function(){var g=new THREE.RingGeometry(1.2,1.7,32);g.rotateX(-Math.PI/2);return g;})(),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95,side:THREE.DoubleSide,depthTest:false}));
marker.visible=false;marker.renderOrder=10;scene.add(marker);
var markerLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,12,0)]),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.8,depthTest:false}));
markerLine.visible=false;scene.add(markerLine);

// ---------- camera orbit ----------
var DEF={theta:0.75,phi:1.05,r:150};
var cam={theta:DEF.theta,phi:DEF.phi,r:DEF.r};
var goal=null,auto=true,dragging=false;
function target(){return new THREE.Vector3(0,(M.max-M.min)*exag*0.35,0);}
function placeCamera(){
  var t=target();
  camera.position.set(t.x+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta),t.y+cam.r*Math.cos(cam.phi),t.z+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(t);
}
var pts={},lastPinch=0;
canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];dragging=true;goal=null;});
canvas.addEventListener('pointerup',function(e){delete pts[e.pointerId];if(!Object.keys(pts).length)dragging=false;lastPinch=0;});
canvas.addEventListener('pointercancel',function(e){delete pts[e.pointerId];dragging=false;});
canvas.addEventListener('pointermove',function(e){
  var ids=Object.keys(pts);
  if(pts[e.pointerId]){
    var p=pts[e.pointerId],dx=e.clientX-p[0],dy=e.clientY-p[1];
    pts[e.pointerId]=[e.clientX,e.clientY];
    if(ids.length===1){cam.theta-=dx*0.006;cam.phi=Math.min(1.5,Math.max(0.12,cam.phi-dy*0.006));}
    else if(ids.length===2){
      var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      if(lastPinch)userZoomed=true;cam.r=Math.min(500,Math.max(50,cam.r*(lastPinch/d)));lastPinch=d;
    }
  }
  probe(e.clientX,e.clientY);
});
canvas.addEventListener('wheel',function(e){e.preventDefault();userZoomed=true;cam.r=Math.min(500,Math.max(50,cam.r*(1+e.deltaY*0.001)));},{passive:false});

// probe
var ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function probe(cx,cy){
  if(dragging||!terrain)return;
  var r=canvas.getBoundingClientRect();
  mv.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(mv,camera);
  var hit=ray.intersectObject(terrain,false)[0];
  var el=document.getElementById('probe');
  if(!hit){marker.visible=false;markerLine.visible=false;return;}
  var x=hit.point.x,z=hit.point.z,h=H(x,z);
  var gx=(H(x+0.5,z)-H(x-0.5,z)),gz=(H(x,z+0.5)-H(x,z-0.5));
  var sl=Math.sqrt(gx*gx+gz*gz)*100;
  var y=Y(x,z)+0.2;marker.position.set(x,y,z);markerLine.position.set(x,y,z);marker.visible=true;markerLine.visible=true;
  el.innerHTML='E '+fmt(x+HALF,1)+' m<br>N '+fmt(HALF-z,1)+' m<br>Elev <b style="color:#38f0ff">'+fmt(h,2)+' m</b><br>Slope '+fmt(sl,1)+' %';
}

// buttons
function toggle(id,fn){var b=document.getElementById(id);b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);});}
toggle('b-rot',function(on){auto=on;});
toggle('b-con',function(on){uniforms.uContour.value=on?1:0;});
toggle('b-wire',function(on){wireOn=on;if(wire)wire.visible=on;});
toggle('b-feat',function(on){featOn=on;if(featureGroup)featureGroup.visible=on;});
function flyTo(g){goal=g;}
document.getElementById('b-top').addEventListener('click',function(){flyTo({theta:cam.theta,phi:0.12,r:170});});
document.getElementById('b-reset').addEventListener('click',function(){flyTo({theta:DEF.theta,phi:DEF.phi,r:DEF.r});});
var ex=document.getElementById('exag'),exv=document.getElementById('exv');
ex.addEventListener('input',function(){exag=parseFloat(ex.value);exv.textContent=exag.toFixed(1);build();});

var userZoomed=false;
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  var a=w/h;DEF.r=a<1?150+(1-a)*330:150;if(!userZoomed)cam.r=DEF.r;}
window.addEventListener('resize',resize);

var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){auto=false;document.getElementById('b-rot').setAttribute('aria-pressed','false');}
var clock=new THREE.Clock();
build();resize();
// URL/test hook: ?view=top etc.
window.__holo={scene:scene,cam:cam,M:M,setAuto:function(v){auto=v;}};

function tick(){
  var dt=Math.min(clock.getDelta(),0.05);
  uniforms.uTime.value+=reduce?0:dt;
  if(auto&&!dragging&&!goal)cam.theta+=dt*0.12;
  if(goal){
    var k=1-Math.pow(0.001,dt);
    cam.theta+= (goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.r+=(goal.r-cam.r)*k;
    if(Math.abs(goal.phi-cam.phi)<0.003&&Math.abs(goal.r-cam.r)<0.3)goal=null;
  }
  animated.forEach(function(m){m.rotation.y+=dt*1.2;});
  var a=pg.attributes.position.array;
  for(var i=0;i<pN;i++){a[i*3+1]+=dt*(2+(i%5)*0.6);if(a[i*3+1]>60)a[i*3+1]=0;}
  pg.attributes.position.needsUpdate=true;
  placeCamera();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>
</body>
</html>
