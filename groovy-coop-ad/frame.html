<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bungee;src:url(fonts/Bungee.woff2)}
@font-face{font-family:Shrikhand;src:url(fonts/Shrikhand.woff2)}
html,body{margin:0;background:#FFF1DC}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// The Groovy Coop: "Kinetic Tiles" style frame.
// A 16x9 grid of 120 px tiles. Every tile is a card: a pattern, an icon or a letter.
// In the film, tiles flip, slide and ripple on the beat; this frame freezes one moment.
const C = document.getElementById('c'), x = C.getContext('2d');
const T = 120, GAP = 8;
const P = { paper:'#FFF1DC', ink:'#2A1748', pink:'#FF3E8A', teal:'#00B8C4', sun:'#FFC531',
            violet:'#7D4CFF', tang:'#FF7420', mint:'#3DD68C', sky:'#5BCEFA', blush:'#F5A9B8', white:'#FFFFFF' };
const R = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(42);

function rr(px,py,w,h,r){ x.beginPath(); x.roundRect(px,py,w,h,r); }

// ---------- patterns ----------
const PAT = {
  dots(s,c1,c2){ x.fillStyle=c1; x.fillRect(0,0,s,s); x.fillStyle=c2;
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){ x.beginPath(); x.arc(15+i*30+(j%2)*15,15+j*30,6,0,7); x.fill(); } },
  zig(s,c1,c2){ x.fillStyle=c1; x.fillRect(0,0,s,s); x.strokeStyle=c2; x.lineWidth=9; x.lineJoin='miter';
    for(let k=0;k<4;k++){ x.beginPath(); for(let i=0;i<=8;i++) x.lineTo(i*s/8, 18+k*30+(i%2?12:-4)); x.stroke(); } },
  check(s,c1,c2){ x.fillStyle=c1; x.fillRect(0,0,s,s); x.fillStyle=c2; const n=4,d=s/n;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++) if((i+j)%2) x.fillRect(i*d,j*d,d,d); },
  stripes(s,cols,h=s){ const d=h/cols.length; cols.forEach((c,i)=>{ x.fillStyle=c; x.fillRect(0,i*d,s,d+1); }); },
  squiggle(s,c1,c2){ x.fillStyle=c1; x.fillRect(0,0,s,s); x.strokeStyle=c2; x.lineWidth=7; x.lineCap='round';
    for(let k=0;k<3;k++){ x.beginPath(); for(let i=0;i<=40;i++){ const u=i/40; x.lineTo(10+u*(s-20), 25+k*35+Math.sin(u*Math.PI*3+k)*9); } x.stroke(); } },
  terrazzo(s,c1,cs){ x.fillStyle=c1; x.fillRect(0,0,s,s);
    for(let i=0;i<22;i++){ x.fillStyle=cs[i%cs.length]; x.beginPath(); const cx=R()*s,cy=R()*s,r=3+R()*6;
      for(let k=0;k<5;k++){ const a=k/5*6.28+R(); x.lineTo(cx+Math.cos(a)*r*(0.6+R()*.6), cy+Math.sin(a)*r*(0.6+R()*.6)); } x.fill(); } },
  leopard(s,c1,c2){ x.fillStyle=c1; x.fillRect(0,0,s,s);
    for(let i=0;i<9;i++){ const cx=(i%3)*42+18+(Math.floor(i/3)%2)*16, cy=Math.floor(i/3)*40+20;
      x.strokeStyle=c2; x.lineWidth=6; x.lineCap='round'; x.beginPath(); x.arc(cx,cy,11,0.4+i,3.6+i); x.stroke();
      x.fillStyle='#C97A2B'; x.beginPath(); x.arc(cx,cy,4,0,7); x.fill(); } },
  rainbow(s,bg){ x.fillStyle=bg; x.fillRect(0,0,s,s); const cs=[P.pink,P.tang,P.sun,P.mint,P.teal,P.violet];
    cs.forEach((c,i)=>{ x.strokeStyle=c; x.lineWidth=9; x.beginPath(); x.arc(s/2,s*0.86,52-i*9,Math.PI,0); x.stroke(); }); },
};

// ---------- icons (drawn centred in an s×s tile) ----------
function ol(){ x.strokeStyle=P.ink; x.lineWidth=5; x.lineJoin='round'; x.lineCap='round'; }
const ICON = {
  tee(s,c){ ol(); x.fillStyle=c; x.beginPath();
    x.moveTo(40,24); x.lineTo(24,34); x.lineTo(14,56); x.lineTo(30,63); x.lineTo(34,54); x.lineTo(34,98); x.lineTo(86,98);
    x.lineTo(86,54); x.lineTo(90,63); x.lineTo(106,56); x.lineTo(96,34); x.lineTo(80,24); x.quadraticCurveTo(60,40,40,24); x.fill(); x.stroke();
    x.fillStyle=P.ink; x.font='18px Bungee'; x.textAlign='center'; x.fillText('ROCK',60,78); },
  sock(s,c){ ol(); x.fillStyle=c; x.beginPath(); x.moveTo(46,16); x.lineTo(76,16); x.lineTo(76,70); x.quadraticCurveTo(78,100,50,102);
    x.lineTo(30,102); x.quadraticCurveTo(18,100,20,88); x.quadraticCurveTo(22,78,36,74); x.lineTo(46,66); x.closePath(); x.fill(); x.stroke();
    x.fillStyle=P.sun; x.fillRect(48,22,26,8); x.fillStyle=P.pink; x.fillRect(48,36,26,8);
    x.fillStyle=P.ink; [[54,56],[66,62],[56,82],[40,88]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,4,0,7);x.fill();}); },
  crystal(s,c){ ol(); x.fillStyle=c; x.beginPath(); x.moveTo(60,12); x.lineTo(84,40); x.lineTo(76,104); x.lineTo(44,104); x.lineTo(36,40); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(36,40); x.lineTo(84,40); x.moveTo(60,12); x.lineTo(60,104); x.stroke();
    x.fillStyle='rgba(255,255,255,.55)'; x.beginPath(); x.moveTo(60,14); x.lineTo(60,40); x.lineTo(40,40); x.fill(); },
  candle(s,c){ ol(); x.fillStyle=c; rr(40,52,40,52,4); x.fill(); x.stroke();
    x.fillStyle=P.sun; x.beginPath(); x.moveTo(60,14); x.quadraticCurveTo(80,40,60,46); x.quadraticCurveTo(40,40,60,14); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(60,46); x.lineTo(60,52); x.stroke(); },
  vinyl(s,c,spin=0){ x.save(); x.translate(60,60); x.rotate(spin); x.fillStyle=P.ink; x.beginPath(); x.arc(0,0,48,0,7); x.fill();
    x.strokeStyle='rgba(255,255,255,.18)'; x.lineWidth=2; for(let r=22;r<46;r+=6){ x.beginPath(); x.arc(0,0,r,0,7); x.stroke(); }
    x.fillStyle=c; x.beginPath(); x.arc(0,0,18,0,7); x.fill(); x.fillStyle=P.paper; x.fillRect(-2,-14,4,9);
    x.fillStyle=P.ink; x.beginPath(); x.arc(0,0,3,0,7); x.fill(); x.restore(); },
  cassette(s,c){ ol(); x.fillStyle=c; rr(14,32,92,58,6); x.fill(); x.stroke(); x.fillStyle=P.paper; rr(24,42,72,22,3); x.fill(); x.stroke();
    x.fillStyle=P.ink; [44,76].forEach(a=>{x.beginPath();x.arc(a,53,6,0,7);x.fill();}); x.beginPath(); x.moveTo(34,90); x.lineTo(40,74); x.lineTo(80,74); x.lineTo(86,90); x.stroke(); },
  pad(s,c){ ol(); x.fillStyle=c; rr(12,40,96,44,10); x.fill(); x.stroke(); x.fillStyle=P.ink;
    x.fillRect(24,58,24,8); x.fillRect(32,50,8,24); [[82,56],[94,66]].forEach(([a,b])=>{x.fillStyle=P.pink;x.beginPath();x.arc(a,b,6,0,7);x.fill();x.stroke();});
    x.fillStyle=P.ink; x.fillRect(54,66,6,3); x.fillRect(64,66,6,3); },
  heart(s,c){ ol(); x.fillStyle=c; x.beginPath(); x.moveTo(60,100); x.bezierCurveTo(10,66,18,22,60,42); x.bezierCurveTo(102,22,110,66,60,100); x.fill(); x.stroke(); },
  spark(s,c){ x.fillStyle=c; const st=(cx,cy,r)=>{ x.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, rad=i%2?r*.28:r; x.lineTo(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad);} x.fill(); };
    st(60,58,40); st(94,26,14); st(28,96,12); },
  hanger(s,c){ ol(); x.lineWidth=6; x.strokeStyle=c; x.beginPath(); x.arc(60,30,10,Math.PI,2.2*Math.PI); x.lineTo(60,46); x.lineTo(14,84); x.lineTo(106,84); x.closePath(); x.stroke(); },
  shades(s,c){ ol(); x.fillStyle=c; x.beginPath(); x.moveTo(14,50); x.lineTo(54,50); x.lineTo(50,74); x.quadraticCurveTo(32,82,18,72); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(66,50); x.lineTo(106,50); x.lineTo(102,72); x.quadraticCurveTo(88,82,70,74); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(54,54); x.quadraticCurveTo(60,48,66,54); x.stroke(); },
  bolt(s,c){ ol(); x.fillStyle=c; x.beginPath(); x.moveTo(68,10); x.lineTo(30,66); x.lineTo(56,66); x.lineTo(46,110); x.lineTo(90,48); x.lineTo(64,48); x.closePath(); x.fill(); x.stroke(); },
  hen(s,c){ ol(); // a round little hen: the coop's mascot
    x.fillStyle=P.white; x.beginPath(); x.ellipse(60,70,34,30,0,0,7); x.fill(); x.stroke();
    x.fillStyle=P.pink; x.beginPath(); x.arc(52,34,8,0,7); x.arc(62,30,8,0,7); x.arc(72,35,7,0,7); x.fill();
    x.fillStyle=P.white; x.beginPath(); x.arc(62,50,18,0,7); x.fill(); x.stroke();
    x.fillStyle=P.sun; x.beginPath(); x.moveTo(78,50); x.lineTo(92,55); x.lineTo(78,60); x.fill(); x.stroke();
    x.fillStyle=P.ink; x.beginPath(); x.arc(68,47,3.5,0,7); x.fill();
    x.strokeStyle=P.ink; x.beginPath(); x.arc(52,74,14,0.2,2.4); x.stroke();
    x.fillStyle='#FF7BA9'; x.beginPath(); x.arc(58,58,4,0,7); x.fill(); },
};

// ---------- a tile: background + optional pattern/icon, with a flip (0 = face, 1 = face again) ----------
function tile(col,row,w,h,draw,{flip=0,slide=[0,0],bg=P.white,shadow=true}={}){
  const px=col*T+GAP/2+slide[0], py=row*T+GAP/2+slide[1], W=w*T-GAP, H=h*T-GAP;
  const sx=Math.cos(flip*Math.PI);              // horizontal flip: width scales by cos
  const face=Math.abs(sx);
  x.save(); x.translate(px+W/2,py+H/2);
  if(shadow){ x.fillStyle=P.ink; rr(-W/2*face+7,-H/2+7,W*face,H,14); x.fill(); }   // hard 80s drop shadow
  x.scale(Math.max(face,0.001),1);
  rr(-W/2,-H/2,W,H,14); x.clip();
  x.translate(-W/2,-H/2);
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  x.save(); x.scale(W/(w*T), H/(h*T)); draw && draw(T); x.restore();
  if(face<0.98){ x.fillStyle=`rgba(42,23,72,${(1-face)*0.45})`; x.fillRect(0,0,W,H); } // shade while turning
  x.restore();
}
function letterTile(col,row,ch,bg,opts={}){
  tile(col,row,2,2,()=>{
    x.fillStyle=bg; x.fillRect(0,0,2*T,2*T);
    x.font='190px Bungee'; x.textAlign='center'; x.textBaseline='alphabetic';
    x.fillStyle=P.ink; x.fillText(ch,T+8,2*T-40+8);
    x.fillStyle=P.paper; x.fillText(ch,T,2*T-40);
  },{bg,...opts});
}
function bandTile(col,row,w,h,text,bg,fg,font,opts={}){
  tile(col,row,w,h,()=>{ x.fillStyle=bg; x.fillRect(0,0,w*T,h*T); x.fillStyle=fg; x.font=font;
    x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,w*T/2,h*T/2+3); },{bg,...opts});
}

async function frame(){
  await document.fonts.load('190px Bungee'); await document.fonts.load('40px Shrikhand');
  x.fillStyle=P.paper; x.fillRect(0,0,1920,1080);

  // faint grid lines: the system under everything
  x.strokeStyle='rgba(42,23,72,.07)'; x.lineWidth=1;
  for(let i=0;i<=16;i++){ x.beginPath(); x.moveTo(i*T,0); x.lineTo(i*T,1080); x.stroke(); }
  for(let j=0;j<=9;j++){ x.beginPath(); x.moveTo(0,j*T); x.lineTo(1920,j*T); x.stroke(); }

  const trans=[P.sky,P.blush,P.white,P.blush,P.sky];
  const pride=[P.pink,P.tang,P.sun,P.mint,P.teal,P.violet];
  // border ring of pattern and product tiles (the shop's shelves, as cards)
  const ring = [
    // row 0
    [0,0,()=>PAT.zig(T,P.violet,P.sun)], [1,0,()=>ICON.crystal(T,'#B9A6FF'),{bg:P.sun}], [2,0,()=>PAT.dots(T,P.teal,P.paper)],
    [3,0,()=>ICON.sock(T,P.mint),{bg:P.pink,flip:0.32}], [4,0,()=>PAT.stripes(T,pride)], [5,0,()=>ICON.cassette(T,P.tang),{bg:P.sky}],
    [6,0,()=>PAT.check(T,P.paper,P.ink)], [7,0,()=>ICON.spark(T,P.sun),{bg:P.violet}], [8,0,()=>PAT.leopard(T,'#F2C46B',P.ink)],
    [9,0,()=>ICON.shades(T,P.pink),{bg:P.mint}], [10,0,()=>PAT.squiggle(T,P.pink,P.paper)], [11,0,()=>ICON.candle(T,P.blush),{bg:P.teal}],
    [12,0,()=>PAT.stripes(T,trans)], [13,0,()=>ICON.tee(T,P.sun),{bg:P.violet,flip:0.62}], [14,0,()=>PAT.terrazzo(T,P.paper,[P.pink,P.teal,P.sun,P.violet])],
    [15,0,()=>ICON.heart(T,P.pink),{bg:P.sun}],
    // row 8
    [0,8,()=>ICON.pad(T,'#D9D2E9'),{bg:P.teal}], [1,8,()=>PAT.rainbow(T,P.paper)], [2,8,()=>ICON.vinyl(T,P.sun,0.6),{bg:P.pink}],
    [3,8,()=>PAT.zig(T,P.sun,P.pink)], [4,8,()=>ICON.hanger(T,P.ink),{bg:P.mint}], [5,8,()=>PAT.dots(T,P.violet,P.sun)],
    [6,8,()=>ICON.crystal(T,P.teal),{bg:P.blush,flip:0.44}], [7,8,()=>PAT.leopard(T,'#F2C46B',P.ink)], [8,8,()=>ICON.sock(T,P.sun),{bg:P.violet}],
    [9,8,()=>PAT.stripes(T,pride)], [10,8,()=>ICON.bolt(T,P.sun),{bg:P.ink}], [11,8,()=>PAT.check(T,P.pink,P.paper)],
    [12,8,()=>ICON.candle(T,P.mint),{bg:P.sun}], [13,8,()=>PAT.squiggle(T,P.teal,P.sun)], [14,8,()=>ICON.cassette(T,P.pink),{bg:P.paper}],
    [15,8,()=>PAT.zig(T,P.tang,P.paper)],
    // columns 0 and 15
    [0,1,()=>ICON.tee(T,P.pink),{bg:P.teal}], [0,2,()=>PAT.terrazzo(T,P.sun,[P.ink,P.pink,P.paper])], [0,3,()=>ICON.heart(T,P.tang),{bg:P.paper}],
    [0,4,()=>PAT.stripes(T,trans),{flip:0.4}], [0,5,()=>ICON.spark(T,P.pink),{bg:P.ink}], [0,6,()=>PAT.dots(T,P.mint,P.ink)], [0,7,()=>ICON.shades(T,P.sun),{bg:P.pink}],
    [15,1,()=>PAT.check(T,P.teal,P.paper)], [15,2,()=>ICON.vinyl(T,P.pink,2.1),{bg:P.sun}], [15,3,()=>PAT.zig(T,P.mint,P.violet)],
    [15,4,()=>ICON.pad(T,P.sun),{bg:P.violet}], [15,5,()=>PAT.leopard(T,'#F2C46B',P.ink),{flip:0.72}], [15,6,()=>ICON.hen(T),{bg:P.teal}], [15,7,()=>PAT.stripes(T,pride)],
  ];
  ring.forEach(([c,r,d,o])=>tile(c,r,1,1,d,o||{}));

  // "THE" pill and the women-owned badge
  bandTile(2,1,2,1,'THE',P.ink,P.sun,'64px Bungee');
  bandTile(11,1,3,1,'women-owned',P.pink,P.paper,'44px Shrikhand',{flip:0.08});
  tile(14,1,1,1,()=>ICON.hen(T),{bg:P.sun});
  tile(4,1,1,1,()=>PAT.dots(T,P.paper,P.pink));
  tile(10,1,1,1,()=>ICON.heart(T,P.violet),{bg:P.paper});
  bandTile(5,1,5,1,'LGBTQIA+ friendly',P.teal,P.paper,'46px Shrikhand');
  tile(1,1,1,1,()=>ICON.spark(T,P.teal),{bg:P.paper});

  // GROOVY: six 2×2 letter cards, one mid-flip
  const g=[['G',P.pink],['R',P.tang],['O',P.sun],['O',P.mint],['V',P.teal],['Y',P.violet]];
  g.forEach(([ch,bg],i)=> letterTile(2+i*2,2,ch,bg,{flip: i===4?0.28:0}));
  tile(1,2,1,2,()=>PAT.stripes(T,pride,2*T),{});
  tile(14,2,1,2,()=>PAT.stripes(T,trans,2*T),{});

  // COOP: the first O is a spinning record, the second is a little sun-face
  tile(1,4,2,2,()=>{ PAT.terrazzo(2*T,P.violet,[P.sun,P.pink,P.paper,P.mint]); },{});
  letterTile(3,4,'C',P.violet);
  tile(5,4,2,2,()=>{ x.fillStyle=P.pink; x.fillRect(0,0,2*T,2*T); x.save(); x.translate(T,T); x.scale(1.75,1.75); x.translate(-60,-60); ICON.vinyl(T,P.sun,0.9); x.restore(); },{bg:P.pink});
  tile(7,4,2,2,()=>{ x.fillStyle=P.teal; x.fillRect(0,0,2*T,2*T); // sun-face O
      x.fillStyle=P.sun; for(let i=0;i<12;i++){ x.save(); x.translate(T,T); x.rotate(i*Math.PI/6); x.beginPath(); x.moveTo(-10,-70); x.lineTo(0,-98); x.lineTo(10,-70); x.fill(); x.restore(); }
      x.beginPath(); x.arc(T,T,66,0,7); x.fill(); x.strokeStyle=P.ink; x.lineWidth=6; x.stroke();
      x.fillStyle=P.ink; x.beginPath(); x.arc(T-22,T-12,7,0,7); x.arc(T+22,T-12,7,0,7); x.fill();
      x.beginPath(); x.lineWidth=7; x.lineCap='round'; x.arc(T,T+4,28,0.3,Math.PI-0.3); x.stroke();
      x.fillStyle='#FF7BA9'; x.beginPath(); x.arc(T-38,T+14,9,0,7); x.arc(T+38,T+14,9,0,7); x.fill(); },{bg:P.teal,flip:0.0});
  letterTile(9,4,'P',P.tang);
  tile(11,4,1,1,()=>ICON.sock(T,P.pink),{bg:P.sun}); tile(12,4,1,1,()=>ICON.crystal(T,'#C9B8FF'),{bg:P.ink});
  tile(13,4,1,1,()=>PAT.squiggle(T,P.sun,P.violet)); tile(14,4,1,1,()=>ICON.candle(T,P.pink),{bg:P.mint});
  tile(11,5,1,1,()=>ICON.cassette(T,P.teal),{bg:P.blush}); tile(12,5,1,1,()=>PAT.check(T,P.sun,P.ink),{flip:0.55});
  tile(13,5,1,1,()=>ICON.tee(T,P.paper),{bg:P.pink}); tile(14,5,1,1,()=>PAT.dots(T,P.ink,P.sun));

  // offerings strip and location
  bandTile(1,6,14,1,'VINTAGE  ✦  ROCK TEES  ✦  FUNNY SOCKS  ✦  CRYSTALS  ✦  GIFTS',P.sun,P.ink,'46px Bungee');
  bandTile(1,7,4,1,'everyone welcome',P.violet,P.paper,'42px Shrikhand');
  bandTile(5,7,10,1,'HISTORIC DOWNTOWN McKINNEY, TX',P.ink,P.paper,'50px Bungee',{});
}
frame().then(()=>{ document.title='ready'; });
</script></body></html>
